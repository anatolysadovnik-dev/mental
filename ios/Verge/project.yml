# Описание проекта для XcodeGen (https://github.com/yonaskolb/XcodeGen).
#
# .xcodeproj в репозитории НЕТ намеренно: это генерируемый артефакт, который
# порождает конфликты слияния при каждой правке и прячет настройки в UI Xcode.
# Здесь всё явно, а Team ID и bundle id — в Config/*.xcconfig (см. Config/README).
#
#   brew install xcodegen && xcodegen generate && open Verge.xcodeproj

name: Verge
options:
  bundleIdPrefix: day.verge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  # XcodeGen по умолчанию ставит en. У нас единственный реальный язык — ru
  # (Localizable.xcstrings, sourceLanguage: ru). Несовпадение development region
  # с фактическим языком контента приводило к тому, что Bundle.localizations
  # содержал фантомный "en" (без en.lproj на диске) с более высоким приоритетом,
  # чем ru — String(localized:)/NSLocalizedString упирались в этот пустой "en"
  # и возвращали сырой ключ, хотя перевод в ru.lproj был.
  developmentLanguage: ru

configs:
  Debug: debug
  Beta: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Только iPhone: UI не адаптирован под iPad, а без этого App Store Connect
    # требует iPad-иконки и все 4 ориентации (ландскейп в т.ч.) для multitasking.
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

configFiles:
  Debug: Config/Debug.xcconfig
  Beta: Config/Beta.xcconfig
  Release: Config/Release.xcconfig

targets:
  Verge:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Verge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Базовый адрес API и режим APNs приезжают из xcconfig — код читает их
        # из Info.plist, чтобы не хардкодить окружение в исходниках.
        RIDGE_API_BASE_URL: $(RIDGE_API_BASE_URL)
        RIDGE_APNS_SANDBOX: $(RIDGE_APNS_SANDBOX)
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы надиктовывать ответы вместо набора текста.
        NSSpeechRecognitionUsageDescription: Распознавание речи превращает надиктованный ответ в текст.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # Файл entitlements лежит в Resources и НЕ генерируется. Debug использует
        # development (симулятор/отладка на устройстве), Beta и Release — production
        # (TestFlight и App Store подписывают production-сертификатом APNs).
        CODE_SIGN_ENTITLEMENTS: Resources/Verge.entitlements
      configs:
        Beta:
          CODE_SIGN_ENTITLEMENTS: Resources/VergeRelease.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/VergeRelease.entitlements

  VergeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Verge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

schemes:
  Verge:
    build:
      targets:
        Verge: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VergeTests
    archive:
      config: Release
